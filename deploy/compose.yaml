services:
  postgres:
    image: postgres:17-alpine
    container_name: sparrow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sparrow
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: sparrow
      TZ: Asia/Shanghai
    command: ["postgres", "-c", "timezone=Asia/Shanghai"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sparrow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparrow -d sparrow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sparrow-pgdata:
