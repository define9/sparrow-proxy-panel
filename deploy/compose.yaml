name: sparrow

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sparrow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 deploy/.env 里设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sparrow}
      TZ: ${TZ:-Asia/Shanghai}
    command: ["postgres", "-c", "timezone=${TZ:-Asia/Shanghai}"]
    volumes:
      - sparrow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sparrow} -d ${POSTGRES_DB:-sparrow}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 不映射端口：只在 compose 内网可达（需要外部调试时临时加 127.0.0.1:5432:5432）
    networks:
      - sparrow

  # 一次性迁移任务：成功退出后 panel 才启动
  migrate:
    build:
      context: ..
      dockerfile: src/panel/Dockerfile
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sparrow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sparrow}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - sparrow

  panel:
    build:
      context: ..
      dockerfile: src/panel/Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-sparrow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sparrow}
      MASTER_KEY: ${MASTER_KEY:?请在 deploy/.env 里设置 MASTER_KEY}
      # 站点对外地址。SITE_URL 运行时读取（改完重启即生效）；
      # NEXT_PUBLIC_SITE_URL 会被构建期内联进前端 bundle，仅作兼容保留。
      SITE_URL: ${SITE_URL:-${NEXT_PUBLIC_SITE_URL:?请在 .env 里设置 SITE_URL}}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-${SITE_URL:?请在 .env 里设置 SITE_URL}}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Agent 分发：面板只代理 GitHub Release，不存发布数据。留空用默认值。
      AGENT_RELEASE_REPO: ${AGENT_RELEASE_REPO:-}
      AGENT_RELEASE_TTL: ${AGENT_RELEASE_TTL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/public/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # 默认只绑定宿主回环：外部 Caddy/Nginx 反代到这里；内置 caddy 也走它。
    # 想直接对外（IPv6 直连、无反代）：deploy/.env 里设 PANEL_BIND=（留空 = 所有接口）
    ports:
      - "${PANEL_BIND:-127.0.0.1}:${PANEL_PORT:-3000}:3000"
    networks:
      - sparrow

  # 可选：机器上没有统一反代时启用（--profile edge）
  caddy:
    profiles: ["edge"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?请在 deploy/.env 里设置 SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-ops@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - sparrow-caddy-data:/data
      - sparrow-caddy-config:/config
    depends_on:
      panel:
        condition: service_started
    networks:
      - sparrow

networks:
  sparrow:
    driver: bridge

volumes:
  sparrow-pgdata:
  sparrow-caddy-data:
  sparrow-caddy-config:
