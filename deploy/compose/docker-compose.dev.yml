# 本地开发用 Docker Compose
#
#   docker compose -f deploy/compose/docker-compose.dev.yml up -d db
#   docker compose -f deploy/compose/docker-compose.dev.yml logs -f db
#   docker compose -f deploy/compose/docker-compose.dev.yml down
#
# 一个 Postgres 容器承载多个业务库（按需 createdb），避免每起一个服务就开一个容器。

name: sparrow-dev

services:
  db:
    image: postgres:17-alpine
    container_name: sparrow-postgres
    restart: unless-stopped
    environment:
      # 开发环境固定口令（生产请用 .env 注入随机值）
      POSTGRES_USER: sparrow
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: sparrow
      # 初始化脚本：可在 initdb/ 时自动建库
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Shanghai
    ports:
      # 只绑本机回环，避免暴露到局域网
      - "127.0.0.1:5432:5432"
    volumes:
      # 具名 volume：docker compose down 不会删，docker compose down -v 才会
      - sparrow-pgdata:/var/lib/postgresql/data
      # 首次启动时执行的初始化脚本
      - ../initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparrow -d sparrow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      # 慢查询日志（开发期也开着，方便发现 N+1）
      - -c
      - log_min_duration_statement=200
      - -c
      - log_line_prefix=%m [%p] %q%u@%d

volumes:
  sparrow-pgdata:
    name: sparrow-pgdata
