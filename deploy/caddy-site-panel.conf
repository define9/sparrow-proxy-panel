# 给"机器上已有统一 Caddy（容器里）"用的站点配置
# 位置示例：~/docker_root/caddy/conf/sites/panel.conf（或直接内联进主 Caddyfile）
#
# 前提：本项目的 panel 已监听宿主回环 127.0.0.1:3000
#       （deploy/compose.caddy-external.yaml 默认如此，可用 PANEL_PORT 改端口）
# 且你的 caddy 容器带：
#       extra_hosts:
#         - "host.docker.internal:host-gateway"
#
# 注意：Caddy 的 { 必须位于行尾、} 独占一行；@matcher 与指令不能和 { 同处一行。

panel.sparrowx.org {
	encode zstd gzip

	# Next 产物带 hash，可长缓存
	@static path /_next/static/*
	header @static Cache-Control "public, max-age=31536000, immutable"

	# 订阅输出由面板自己控制缓存
	@sub path /sub/*
	header @sub Cache-Control "private, max-age=60"

	# 容器访问宿主回环（与 paseo 那条 6767 的写法一致）
	reverse_proxy http://host.docker.internal:3000 {
		header_up X-Real-IP {remote_host}
		header_up X-Forwarded-Proto {scheme}
	}
}
