# 给"机器上已有统一 Caddy（跑在容器里）"用的站点配置
# 放置位置示例：~/docker_root/caddy/conf/sites/panel.conf
#
# 两个前提：
#   1. 你的 caddy 容器与本项目共用一个 docker 网络（下面 EDGE_NETWORK，默认 web）
#   2. 本项目的 compose.caddy-external.yaml 已加入同一网络
#
# 反代目标是容器 DNS 名 panel:3000（不是 127.0.0.1:3000）

panel.sparrowx.org {
	encode zstd gzip

	@static path /_next/static/*
	header @static Cache-Control "public, max-age=31536000, immutable"

	@sub path /sub/*
	header @sub Cache-Control "private, max-age=60"

	reverse_proxy panel:3000 {
		header_up X-Forwarded-For {remote_host}
		header_up X-Real-IP {remote_host}
	}
}
