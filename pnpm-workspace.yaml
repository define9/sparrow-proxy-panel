packages:
  - "src/panel"
  - "packages/*"

# pnpm 10+ 默认阻止依赖执行安装脚本（供应链保护）；
# pnpm 12 起「存在被忽略的构建脚本」会直接报 ERR_PNPM_IGNORED_BUILDS。
# 这里只放行构建必需的二进制下载类依赖，其余保持默认拒绝。
onlyBuiltDependencies:
  - esbuild
  - "@swc/core"
  - "@parcel/watcher"
  - unrs-resolver
  - sharp
  - "@tailwindcss/oxide"

minimumReleaseAgeExclude:
  - lucide-react@1.66.0
