# oapi-codegen 生成配置：从面板契约 packages/contracts/openapi.json 生成 Go 客户端。
#
# 生成命令（仓库根目录执行）：
#   cd src/agent
#   oapi-codegen --config oapi-codegen.yaml ../../packages/contracts/openapi.json > internal/client/api.gen.go
#
# 生成的代码请勿手改；契约变化后重新生成即可。
package: client
output: internal/client/api.gen.go
generate:
  models: true
  client: true
  strict-server: false
output-options:
  skip-prune: true
